<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>招商代理申请</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="form-box">
<h1>招商/代理合作申请</h1>
<form action="php/submit.php" method="post">
姓名:<input name="name" required>
性别:<select name="gender"><option>男</option><option>女</option></select>
联系电话:<input name="phone" required>
微信:<input name="wechat">
WhatsApp:<input name="whatsapp">
合作类型:<select name="type"><option>招商人员</option><option>代理商</option></select>
产品类别:<input name="product">
<button>提交申请</button>
</form>
</div>
</body>
</html>
