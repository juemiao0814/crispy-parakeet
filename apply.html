<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>招商代理申请 · 礼诚天下</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="apply-header">
  <div class="brand">
    <span class="seal">礼</span>
    <div class="wordmark">
      <span class="company-cn">礼诚天下</span>
      <span class="tagline">全球招商合作平台</span>
    </div>
  </div>
  <a class="back-link" href="index.html">← 返回首页</a>
</header>

<div class="form-page">
  <p class="form-eyebrow">合作申请</p>
  <h1>招商 / 代理合作申请</h1>
  <p class="form-sub">请填写以下信息，我们将在24小时内与您联系</p>

  <div class="form-box">
    <form action="php/submit.php" method="post">
      <div class="field">
        <label for="name">姓名</label>
        <input id="name" name="name" required>
      </div>
      <div class="field">
        <label for="gender">性别</label>
        <select id="gender" name="gender">
          <option>男</option>
          <option>女</option>
        </select>
      </div>
      <div class="field">
        <label for="phone">联系电话</label>
        <input id="phone" name="phone" required>
      </div>
      <div class="field">
        <label for="wechat">微信</label>
        <input id="wechat" name="wechat">
      </div>
      <div class="field">
        <label for="whatsapp">WhatsApp</label>
        <input id="whatsapp" name="whatsapp">
      </div>
      <div class="field">
        <label for="type">合作类型</label>
        <select id="type" name="type">
          <option>招商人员</option>
          <option>代理商</option>
        </select>
      </div>
      <div class="field">
        <label for="product">产品类别</label>
        <input id="product" name="product">
      </div>
      <button type="submit">提交申请</button>
    </form>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-brand">礼诚天下</div>
  <p class="copyright">© 2026 礼诚天下 Li Cheng Tian Xia. All rights reserved.</p>
</footer>

</body>
</html>
